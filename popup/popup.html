
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main>
    <div class="popup-header">
      <h2>Video Downloader</h2>

      <label class="toggle-control">
        <span>下載按鈕</span>
        <input type="checkbox" id="download-buttons-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <label for="download-path">下載位置（自動儲存）</label>
    <input
      type="text"
      id="download-path"
      placeholder="例如 F:\download"
    >

    <section id="download-tasks" hidden>
      <div class="tasks-header">
        <h3>下載清單</h3>
        <span id="tasks-count">0 個任務</span>
      </div>

      <div id="tasks-list"></div>
    </section>

    <p id="status"></p>
  </main>

  <script src="./popup.js"></script>
</body>
</html>
